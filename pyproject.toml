[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankoon"]

[project]
name = "Rankoon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[tool.pytest.ini_options]
addopts = ["--ignore=artifacts"]
